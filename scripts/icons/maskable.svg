<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.15"/><stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <g id="blobs">
      <circle cx="140" cy="300" r="105" fill="#17B6DC" fill-opacity="0.6"/>
      <circle cx="256" cy="200" r="105" fill="#7BA93D" fill-opacity="0.55"/>
      <circle cx="372" cy="300" r="105" fill="#C53C55" fill-opacity="0.6"/>
    </g>
    <clipPath id="c1"><rect x="160" y="110" width="192" height="288" rx="32" transform="rotate(-16 256 440)"/></clipPath>
    <clipPath id="c2"><rect x="160" y="110" width="192" height="288" rx="32" transform="rotate(16 256 440)"/></clipPath>
    <clipPath id="c3"><rect x="160" y="100" width="192" height="288" rx="32"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Motiv auf 80 % verkleinert: Android schneidet maskierbare Icons auf einen Kreis in der Mitte zu -->
  <g transform="translate(51.2 51.2) scale(0.8)">
  <use href="#blobs" filter="url(#glow)"/>
  <!-- Karte links -->
  <rect x="160" y="110" width="192" height="288" rx="32" transform="rotate(-16 256 440)" fill="#fff" fill-opacity="0.03" filter="url(#shadow)"/>
  <g clip-path="url(#c1)"><rect width="512" height="512" fill="url(#bg)"/><use href="#blobs" filter="url(#frost)"/><rect width="512" height="512" fill="url(#sheen)"/></g>
  <rect x="160" y="110" width="192" height="288" rx="32" transform="rotate(-16 256 440)" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <!-- Karte rechts -->
  <rect x="160" y="110" width="192" height="288" rx="32" transform="rotate(16 256 440)" fill="#fff" fill-opacity="0.03" filter="url(#shadow)"/>
  <g clip-path="url(#c2)"><rect width="512" height="512" fill="url(#bg)"/><use href="#blobs" filter="url(#frost)"/><rect width="512" height="512" fill="url(#sheen)"/></g>
  <rect x="160" y="110" width="192" height="288" rx="32" transform="rotate(16 256 440)" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <!-- Karte vorn -->
  <rect x="160" y="100" width="192" height="288" rx="32" fill="#fff" fill-opacity="0.03" filter="url(#shadow)"/>
  <g clip-path="url(#c3)"><rect width="512" height="512" fill="url(#bg)"/><use href="#blobs" filter="url(#frost)"/><rect width="512" height="512" fill="url(#sheen)"/></g>
  <rect x="160" y="100" width="192" height="288" rx="32" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <text x="256" y="305" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="170" font-weight="700" fill="#fff">L</text>
  </g>
</svg>
